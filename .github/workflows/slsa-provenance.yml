name: SLSA Provenance

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_REGISTRY: index.docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/slsa

jobs:
  # Job 1 — Build and push the container image
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image name output
        id: image
        run: |
          echo "image=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  # Job 2 — Generate SLSA L3 provenance in a completely isolated job
  provenance:
    needs: [build]
    permissions:
      actions: read       # detect GitHub Actions environment
      id-token: write     # create OIDC tokens for signing
    if: startsWith(github.ref, 'refs/tags/')
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
    secrets:
      registry-password: ${{ secrets.DOCKERHUB_TOKEN }}